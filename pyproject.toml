[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Streamstats"
version = "0.9.5"
description = "Парсер логов в формате jsonl и csv. Анализирует логи и выдает общую статистику"
readme = "README.md"
requires-python = ">=3.14.7"
authors = [{name = "Негм Али"}]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "pytest-datadir>=1.8.0"
]